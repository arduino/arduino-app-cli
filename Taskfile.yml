version: "3"

# `.env.local` takes precedence. Only new keys found in the `.env` will be
# appended to the current set.
dotenv: [".env.local", ".env"]

vars:
  GOLANGCI_LINT_VERSION: v2.11.4
  GOIMPORTS_VERSION: v0.42.0
  DPRINT_VERSION: 0.48.0
  EXAMPLE_VERSION: "0.12.1"
  RUNNER_VERSION: "0.12.0"
  VERSION: # if version is not passed we hack the semver by encoding the commit as pre-release
    sh: echo "${VERSION:-0.0.0-$(git rev-parse --short HEAD)}"

tasks:
  init:
    desc: Setup local env
    deps:
      - install:linter
      - install:goimports
      - install:watcher
      - install:dprint
      - install:oapi-codegen
      - install:reuse

  install:linter:
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b .bin/ {{ .GOLANGCI_LINT_VERSION }}

  install:reuse:
    cmds:
      - uv tool install reuse

  install:goimports:
    cmds:
      - go install golang.org/x/tools/cmd/goimports@{{ .GOIMPORTS_VERSION }}

  install:watcher:
    cmds:
      - go install github.com/githubnemo/CompileDaemon@v1.4.0

  install:dprint:
    cmds:
      - curl -fsSL https://dprint.dev/install.sh | sh -s {{ .DPRINT_VERSION }}
      - mkdir -p .bin && cp $HOME/.dprint/bin/dprint .bin/dprint # workaround for local install

  install:oapi-codegen:
    cmds:
      - go get -tool github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1

  test:
    desc: Run all tests
    deps: [test:internal, test:pkg]

  test:internal:
    deps:
      - task: download-runner-assets
        vars:
          DEST: internal/e2e/daemon/testdata/assets
    cmds:
      - go build ./cmd/arduino-app-cli
      - task: generate
      - go tool gotest.tools/gotestsum $(go list ./internal/... ./cmd/... | grep -v internal/e2e/updatetest) -v -race {{ .CLI_ARGS }}

  test:update:
    cmds:
      - go tool gotest.tools/gotestsum -- -v -timeout=60m ./internal/e2e/updatetest

  test:pkg:
    desc: Run only tests in the pkg directory
    cmds:
      - go tool gotest.tools/gotestsum ./pkg/... -v -race {{ .CLI_ARGS }}

  test:cover:
    desc: Run all tests and open cover html report
    cmds:
      - task test -- -coverprofile=coverage.out
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out

  lint:
    desc: Run the linters
    cmds:
      - ${PWD}/.bin/golangci-lint run --fix -v --timeout 300s {{ .CLI_ARGS }}

  fmt:
    desc: Run format
    cmds:
      - goimports -l -w .
      - ${PWD}/.bin/dprint fmt

  generate:
    desc: Run go generate
    cmds:
      - go generate ./...

  fmt-check:
    desc: Check format
    cmds:
      - ${PWD}/.bin/dprint check

  doc:
    desc: Doc generation
    cmds:
      - go run ./cmd/gendoc

  api:docs:
    desc: Open api docs
    cmds:
      - python3 -m http.server 8000 -d internal/api/docs/

  go:check-license-headers:
    desc: verify presence of license headers and exit with non-zero code if missing
    cmds:
      - uvx reuse lint

  go:update-license-headers:
    desc: Update license headers in Go files with reuse template
    cmds:
      - uvx reuse annotate --template arduino-app-cli --exclude-year --copyright "Arduino s.r.l. and/or its affiliated companies"  --license GPL-3.0-or-later -r  $(find . -name "*.go" -o -name "*.sh" -type f -print0 | xargs -0)

  build-deb:
    desc: Build debian package
    deps:
      - build-deb:clone-examples
      - build-deb:copyright
      - task: download-runner-assets
        vars:
          DEST: debian/arduino-app-cli/var/lib/arduino-app-cli/assets
    cmds:
      - docker build --build-arg BINARY_NAME=arduino-app-cli --build-arg DEB_NAME=arduino-app-cli --build-arg VERSION={{ .VERSION }} --build-arg ARCH={{ .ARCH }} --build-arg RELEASE={{ .RELEASE }} --output={{ .OUTPUT }} -f debian/Dockerfile .
    vars:
      ARCH: '{{.ARCH | default "arm64"}}'
      OUTPUT: '{{.OUTPUT | default "./build"}}'

  build-deb:clone-examples:
    desc: "Clones the examples repo directly into the debian structure"
    cmds:
      - |
          set -e
          echo "Runner version set as: {{ .EXAMPLE_VERSION }}"
          TMP_PATH="$(mktemp -d)"
          DEST_PATH="debian/arduino-app-cli/var/lib/arduino-app-cli/"
          echo "Cloning arduino/app-bricks-examples into temporary directory ${TMP_PATH}..."
          git clone --depth 1 --branch "{{ .EXAMPLE_VERSION }}" https://github.com/arduino/app-bricks-examples "${TMP_PATH}"
          rm -rf "${DEST_PATH}/examples"
          mkdir -p "${DEST_PATH}/examples"
          mv "${TMP_PATH}/core-and-foundational" "${DEST_PATH}/examples"
          mv "${TMP_PATH}/inspirational" "${DEST_PATH}/examples"
          mv "${TMP_PATH}/bricks" "${DEST_PATH}/examples"
          mv "${TMP_PATH}/examples.json" "${DEST_PATH}/examples"
          rm -rf "${TMP_PATH}"
          echo "Examples successfully cloned."
    silent: false

  build-deb:copyright:
    desc: Add dependency licenses to debian copyright file
    cmds:
      - mkdir -p debian/arduino-app-cli/usr/share/doc/arduino-app-cli
      - |
          cat > debian/arduino-app-cli/usr/share/doc/arduino-app-cli/copyright <<EOF
          Copyright Arduino s.r.l. and/or its affiliated companies

          This program is free software: you can redistribute it and/or modify
          it under the terms of the GNU General Public License as published by
          the Free Software Foundation, either version 3 of the License, or
          (at your option) any later version.

          This program is distributed in the hope that it will be useful,
          but WITHOUT ANY WARRANTY; without even the implied warranty of
          MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
          GNU General Public License for more details.

          You should have received a copy of the GNU General Public License
          along with this program.  If not, see <https://www.gnu.org/licenses/>.

          ---

          EOF
      - cat .licenses/arduino-app-cli/NOTICE >> debian/arduino-app-cli/usr/share/doc/arduino-app-cli/copyright

  download-runner-assets:
    desc: "Downloads the python runner assets into the given DEST directory"
    vars:
      SEMVER_TAG: "{{.RUNNER_VERSION}}"
      DEST: "{{.DEST}}"
      TMPDIR:
        sh: mktemp -d
    requires:
      vars: [DEST]
    status:
      # Skip only if the assets for the current version are the sole content of DEST.
      - test -d "{{.DEST}}/{{.SEMVER_TAG}}"
      - test "$(ls -A {{.DEST}} 2>/dev/null | wc -l)" -eq 1
    cmds:
      - defer: rm -rf "{{.TMPDIR}}"
      - |
          set -e
          echo "Runner version set as: {{ .RUNNER_VERSION }}"
          gh release download -R arduino/app-bricks-py "release/{{.SEMVER_TAG}}" -p '*.whl' -D "{{.TMPDIR}}" --clobber
          unzip -o "{{.TMPDIR}}/arduino_app_bricks-{{.SEMVER_TAG}}-py3-none-any.whl" -d "{{.TMPDIR}}/extract"
          # Wipe any previous versions so the destination contains exactly one.
          rm -rf "{{.DEST}}" && mkdir -p "{{.DEST}}"
          cp -r "{{.TMPDIR}}/extract/arduino/app_bricks/static" "{{.DEST}}/{{.SEMVER_TAG}}"
          echo "Runner assets successfully downloaded to {{.DEST}}."
    silent: false

  build:
    desc: "Build the arduino-app-cli locally"
    cmds:
      - go build -v -o ./build/arduino-app-cli ./cmd/arduino-app-cli

  start:
    desc: "build and launch the arduino-app-cli in daemon mode"
    cmds:
      - task build
      - ./build/arduino-app-cli daemon  --port 8800

  arduino-app-cli:release:
    desc: Create a tag on the current commit and push it to the remote to create the release
    cmds:
      - |
          if [ -z "{{.CLI_ARGS}}" ]; then
            echo "Error: Version argument is required. Usage: task orchestrator:trigger:release -- <version>"
            exit 1
          fi
      - git tag -a "{{.CLI_ARGS}}" -m "Release {{.CLI_ARGS}}"
      - git push origin "{{.CLI_ARGS}}"

  # To to forward a port, using ssh, you can use this command:
  # ssh -L 8800:localhost:8800 arduino@<BOARD_IP>
  arduino-app-cli:pprof:
    desc: Open pprof UI
    cmds:
      - go tool pprof -http=:8084   {{ .URL }}/debug/pprof/{{ .TYPE }}
    vars:
      TYPE: '{{.TYPE | default "heap"}}' # goroutine, heap, mutex
      URL: '{{ .URL| default "http://localhost:8800" }}'

  adbd:start:
    desc: interact with adbd
    cmds:
      - docker build -t adbd -f adbd.Dockerfile .
      - docker rm -f adbd || true
      - docker run --rm --name adbd -d -p 5555:5555 -p 2222:22 -v $HOME/.arduino-app-cli/examples:/apps adbd

  adbd:stop:
    desc: stop adbd
    cmds:
      - docker rm -f adbd

  board:install:
    desc: Install arduino-app-cli on the board
    interactive: true
    cmds:
      - rm ./build/*.deb || true
      - task: build-deb
      - adb shell rm /tmp/*.deb || true
      - adb push ./build/arduino-app-cli_*_arm64.deb /tmp/
      - ./scripts/run-remote-sudo.sh "dpkg -i /tmp/arduino-app-cli*_arm64.deb && needrestart -r a"

  board:install-dlv:
    desc: "Cross-compile dlv for linux/arm64 and push it to the board."
    vars:
      DLV_LOCAL: ./build/dlv-arm64
      DLV_BOARD_PATH: /home/arduino/go/bin/dlv
    env:
      GOTOOLCHAIN: local
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o {{.DLV_LOCAL}} github.com/go-delve/delve/cmd/dlv
      - adb shell mkdir -p /home/arduino/go/bin
      - adb push {{.DLV_LOCAL}} {{.DLV_BOARD_PATH}}
      - adb shell chmod +x {{.DLV_BOARD_PATH}}

  board:debug:
    desc: "Build a debug binary, deploy to board and start dlv headless on port 2345. Then attach VS Code."
    interactive: true
    deps: [board:install-dlv]
    vars:
      DEBUG_BINARY: ./build/arduino-app-cli-debug
      BOARD_PATH: /home/arduino/arduino-app-cli-debug
      DLV_PORT: '{{.DLV_PORT | default "2345"}}'
      APP_PORT: '{{.APP_PORT | default "8801"}}'
    env:
      GOTOOLCHAIN: local
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -gcflags="all=-N -l" -o {{.DEBUG_BINARY}} ./cmd/arduino-app-cli
      - adb push {{.DEBUG_BINARY}} {{.BOARD_PATH}}
      - adb shell chmod +x {{.BOARD_PATH}}
      - adb forward tcp:{{.DLV_PORT}} tcp:{{.DLV_PORT}}
      - adb forward tcp:{{.APP_PORT}} tcp:{{.APP_PORT}}
      - adb shell "/home/arduino/go/bin/dlv --listen=:{{.DLV_PORT}} --headless --api-version=2 exec {{.BOARD_PATH}} -- daemon --port {{.APP_PORT}} --log-level debug"

  board:debug-cli:
    desc: 'Build a debug binary, deploy to board and start dlv headless for a one-shot CLI command. Invoke as: CLI_ARGS="app start ..." task board:debug-cli'
    interactive: true
    deps: [board:install-dlv]
    vars:
      DEBUG_BINARY: ./build/arduino-app-cli-debug
      BOARD_PATH: /home/arduino/arduino-app-cli-debug
      DLV_PORT: '{{.DLV_PORT | default "2345"}}'
    env:
      GOTOOLCHAIN: local
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -gcflags="all=-N -l" -o {{.DEBUG_BINARY}} ./cmd/arduino-app-cli
      - adb push {{.DEBUG_BINARY}} {{.BOARD_PATH}}
      - adb shell chmod +x {{.BOARD_PATH}}
      - adb forward tcp:{{.DLV_PORT}} tcp:{{.DLV_PORT}}
      - adb shell "DOCKER_REGISTRY_BASE=${DOCKER_REGISTRY_BASE:-ghcr.io/arduino/} /home/arduino/go/bin/dlv --listen=:{{.DLV_PORT}} --headless --api-version=2 exec {{.BOARD_PATH}} -- ${CLI_ARGS:-app list}"

  bump:runner-version:
    desc: Update the RunnerVersion constant in config.go to match RUNNER_VERSION.
    vars:
      sed_replacement: s#RunnerVersion = \".*#RunnerVersion = \"{{.RUNNER_VERSION}}\"#
    cmds:
      - cmd: echo "Updating the runnerVersion in config.go to '{{.RUNNER_VERSION}}'"
      - cmd: sed -i "{{.sed_replacement}}" internal/orchestrator/config/config.go
        platforms: [linux, windows]
      - cmd: sed -i '' "{{.sed_replacement}}" internal/orchestrator/config/config.go
        platforms: [darwin]

  # Source: https://github.com/arduino/tooling-project-assets/blob/main/workflow-templates/assets/check-dependencies-task/Taskfile.yml
  general:cache-dep-licenses:
    desc: Cache dependency license metadata
    deps:
      - task: general:prepare-deps
    cmds:
      - |
          if
            ! which licensed \
            &>/dev/null
          then
            if [[ {{OS}} == "windows" ]]; then
              echo "Licensed does not have Windows support."
              echo "Please use Linux/macOS or download the dependencies cache from the GitHub Actions workflow artifact."
            else
              echo "licensed not found or not in PATH."
              echo "Please install: https://github.com/licensee/licensed#installation"
            fi
            exit 1
          fi
      - licensed cache
      - licensed notices
      - go tool licensed-notice-deduplicate .licenses/arduino-app-cli/NOTICE

  # Source: https://github.com/arduino/tooling-project-assets/blob/main/workflow-templates/assets/check-dependencies-task/Taskfile.yml
  general:check-dep-licenses:
    desc: Check for unapproved dependency licenses
    deps:
      - task: general:cache-dep-licenses
    cmds:
      - |
          MATCHES="$(
            find \
              .licenses \
              -regex '.+\.yml' \
              -type f \
              -print0 \
            | \
              xargs \
                --null \
                go tool \
                  github.com/mikefarah/yq/v4 \
                    'select(.license == "other") | filename'
          )"
          if [[ "$MATCHES" != "" ]]; then
            printf "%s" "$MATCHES"
            echo
            echo "The license cache files above have the license set to 'other'. Please manually define the license type and retry."
            echo "See: https://github.com/arduino/tooling-project-assets/blob/main/workflow-templates/check-go-dependencies-task.md#unrecognized-licenses"
            exit 1
          fi
      - licensed status

  # Source: https://github.com/arduino/tooling-project-assets/blob/main/workflow-templates/assets/check-go-dependencies-task/Taskfile.yml
  general:prepare-deps:
    desc: Prepare project dependencies for license check
    # No preparation is needed for Go module-based projects.

  general:generate-ei-client:
    desc: "Generate Go client for Edge Impulse API using oapi-codegen and filtering by used paths"
    cmds:
      - |
          curl -fsSL https://studio.edgeimpulse.com/openapi.yml | yq '.paths = {
          "/api/{projectId}/deployment": .paths."/api/{projectId}/deployment",
          "/api/{projectId}/deployment/download": .paths."/api/{projectId}/deployment/download",
          "/api/{projectId}/jobs/build-ondevice-model": .paths."/api/{projectId}/jobs/build-ondevice-model",
          "/api/{projectId}/jobs/{jobId}/status": .paths."/api/{projectId}/jobs/{jobId}/status",
          "/api/{projectId}": .paths."/api/{projectId}",
          "/api/{projectId}/jobs/{jobId}/stdout": .paths."/api/{projectId}/jobs/{jobId}/stdout",
          "/api/{projectId}/deployment/last": .paths."/api/{projectId}/deployment/last"
            }' > openapi-filtered.yml
      - oapi-codegen --package=edgeimpulse --generate types,client --response-type-suffix=HTTPResponse openapi-filtered.yml > internal/api/edgeimpulse/client.gen.go
      - rm openapi-filtered.yml
