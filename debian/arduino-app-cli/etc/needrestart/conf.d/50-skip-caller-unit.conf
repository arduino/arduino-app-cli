# Skip restarting the systemd unit that owns needrestart's own cgroup.
# Mirrors Ubuntu's lp2067482 patch on Debian, so needrestart isn't
# cascade-killed by systemctl restart while iterating its queue.
my $self_cgroup = nr_get_cgroup($$);
if (defined $self_cgroup && $self_cgroup =~ m{/([^/]+\.service)$}) {
    push @{$nrconf{blacklist_rc}}, qr/^\Q$1\E$/;
}
