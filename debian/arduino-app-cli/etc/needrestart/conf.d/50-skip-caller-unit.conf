# Skip restarting the systemd unit that owns needrestart's own cgroup.
# Mirrors Ubuntu's lp2067482 patch on Debian, so needrestart isn't
# cascade-killed by systemctl restart while iterating its queue.
#
# Only a daemon from 0.14.0 on sets NEEDRESTART_MODE=a, and only it restarts
# itself after the update. An older daemon, still running while it installs
# this package, must be restarted by needrestart as it was before: it then
# never sends 'done' after 'restarting', and App Lab up to 0.11.0 starts its
# own update on each of the two.
if (($ENV{NEEDRESTART_MODE} // '') eq 'a') {
    if (defined &nr_get_cgroup) {
        my $self_cgroup = nr_get_cgroup($$);
        if (defined $self_cgroup && $self_cgroup =~ m{/([^/]+\.service)$}) {
            push @{$nrconf{blacklist_rc}}, qr/^\Q$1\E$/;
        }
    }
    # nr_get_cgroup is exported since 3.11 only, and get_cgroup_unit is Ubuntu's
    # own lp2067482 patch. With neither of them nothing protects needrestart.
    elsif (!defined &get_cgroup_unit) {
        warn "needrestart $NeedRestart::VERSION has no self-unit skip: it may cascade-kill itself while restarting services\n";
    }
}
