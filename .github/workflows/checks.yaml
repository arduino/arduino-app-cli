name: Run Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# In the same branch only 1 workflow per time can run. In case we're not in the
# main branch we cancel previous running workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # Used by the buf to create a comment with a brief summary of failing tets
  pull-requests: write

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dprint/check@v2.2
        with:
          dprint-version: 0.48.0

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout 300s

      # Every sudo command is declared in internal/sudo, pkg/board apart.
      - name: Check no command bypasses internal/sudo
        run: |
          if git grep -n --untracked '"sudo"' -- '*.go' ':!*_test.go' ':!internal/sudo/*' ':!pkg/board/*'; then
            echo "::error::declare the command in internal/sudo instead"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check go mod
        run: |
          go mod tidy
          git diff --color --exit-code
